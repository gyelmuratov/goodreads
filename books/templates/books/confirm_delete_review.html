{% extends 'base.html' %}


{% block title %}Confirm Delete review{% endblock %}

{% block content %}

    <h3>Are you sure want to delete this review?</h3>

    <p>
        <b>Book</b>: {{ book.title }}
    </p>
        <b>Comment</b>: {{ review.comment }}

    <a href="{% url 'books:delete-review' book.id review.id %}" class="btn btn-outline-danger">Yes</a>
    <a href="{% url 'books:detail' book.id %}" class="btn btn outline-primary">No</a>
{% endblock %}
