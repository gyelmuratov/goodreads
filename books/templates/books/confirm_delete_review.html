{% extends 'base.html' %}


{% block title %}Confirm Delete review{% endblock %}

{% block content %}
  <section class="card border-0 shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">Delete review?</h1>
      <p class="mb-2"><strong>Book:</strong> {{ book.title }}</p>
      <p class="text-muted mb-3"><strong>Comment:</strong> {{ review.comment }}</p>
      <form method="post" action="{% url 'books:delete-review' book.id review.id %}" class="d-inline" data-submit-loading>
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
      <a href="{% url 'books:detail' book.id %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </section>
{% endblock %}
