{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile | Goodreads Clone{% endblock %}

{% block content %}
  <section class="auth-card mx-auto">
    <h1 class="h4 mb-3">Edit profile</h1>
    <form method="post" enctype="multipart/form-data" data-submit-loading>
      {% csrf_token %}
      {{ form | crispy }}
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save changes</button>
        <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
