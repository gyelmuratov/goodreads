{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register | Goodreads Clone{% endblock %}

{% block content %}
  <section class="auth-card mx-auto">
    <h1 class="h4 mb-3">Create account</h1>
    <form method="post" action="{% url 'users:register' %}" data-submit-loading>
      {% csrf_token %}
      {{ form | crispy }}
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
  </section>
{% endblock %}
