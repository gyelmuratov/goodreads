{% extends 'base.html' %}

{% block title %}Profile | Goodreads Clone{% endblock %}

{% block content %}
  <section class="profile-card mx-auto text-center">
    <img class="avatar avatar-lg mb-3" alt="Profile picture" src="{{ user.profile_picture.url }}">
    <h1 class="h4 mb-1">{{ user.first_name }} {{ user.last_name }}</h1>
    <p class="text-muted mb-1">@{{ user.username }}</p>
    <p class="text-muted mb-3">{{ user.email }}</p>
    <a class="btn btn-primary" href="{% url 'users:profile-edit' %}">Edit profile</a>
    <p class="small text-muted mt-3 mb-0">Joined {{ user.date_joined|date:"M d, Y" }}</p>
  </section>

{% endblock %}
