{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log In | Goodreads Clone{% endblock %}

{% block content %}
  <section class="auth-card mx-auto">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post" data-submit-loading>
      {% csrf_token %}
      {{ login_form | crispy }}
      <button class="btn btn-primary w-100" type="submit">Log in</button>
      <p class="small text-muted mt-3 mb-0">No account? <a href="{% url 'users:register' %}">Create one</a>.</p>
    </form>
  </section>

{% endblock %}
